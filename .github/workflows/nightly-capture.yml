# Scheduler only — the capture itself runs on Fly, never here.
#
# GitHub's shared runners are the wrong place to MEASURE latency (noisy neighbours vary run to
# run, and the headline metric is p75 latency). But they are a perfectly good clock: this workflow
# does nothing but make one API call to start the Fly Machine at a fixed hour, which Fly's own
# `--schedule daily` cannot pin down.
name: Nightly benchmark capture
on:
  schedule:
    - cron: "0 7 * * *"        # 07:00 UTC = 02:00 US Eastern — quiet hours for US storefronts
  workflow_dispatch:            # manual trigger for the first run / re-runs

jobs:
  start-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Start the capture Machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # The Machine runs the pipeline and exits on its own, so this returns immediately.
        # --restart no: a failed capture must NOT loop; the healthcheck already alerts on Slack.
        # Fly tags images `deployment-<id>`, NOT `latest` — passing :latest fails with
        # "Could not find image", which would have broken this on the very first night.
        # Resolve the currently-deployed image instead of guessing a tag.
        run: |
          IMG=$(flyctl status --app gorgias-benchmark-capture \
                | grep -oE 'gorgias-benchmark-capture:deployment-[A-Z0-9]+' | head -1)
          if [ -z "$IMG" ]; then echo "could not resolve deployed image"; exit 1; fi
          echo "starting registry.fly.io/$IMG"
          flyctl machine run "registry.fly.io/$IMG" --app gorgias-benchmark-capture \
            --region iad --vm-size performance-2x --vm-memory 8192 \
            --volume benchmark_data:/data --restart no --detach
