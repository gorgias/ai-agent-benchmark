# Unit tests + data quality gate — runs on every PR so a broken classifier,
# reply-cleaner, or bake can't reach master (the report deploys from master root).
name: tests
on:
  pull_request:
  push:
    branches: [master]
jobs:
  unit:
    runs-on: gh-actions-2cpu2gb-runner-set
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version: 22 }
      - name: Unit tests (classifier, reply-clean, turn-quality, message-style, product-rec)
        working-directory: runner
        run: node --test ./*.test.js
      - name: Data quality gate (baked report invariants + judge coverage)
        working-directory: runner
        run: node verify-data.js
