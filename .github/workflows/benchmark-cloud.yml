name: Benchmark (cloud, headed via xvfb)

# SCALABLE design: one parallel job PER VENDOR (matrix), each captures its vendor headed
# under a virtual display (xvfb) on its own runner, uploads its results as an artifact.
# A final "aggregate" job merges all artifacts, rebuilds the report, and commits once.
# Per-STEP timeout (not job) so a slow shard still uploads whatever it captured.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Lane: shopping | support | (blank = both)"
        required: false
        default: ""
      run_date:
        description: "Run date YYYY-MM-DD (blank = today)"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC

permissions:
  contents: write

concurrency:
  group: benchmark-cloud
  cancel-in-progress: false

jobs:
  capture:
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        include:
          - { vendor: "Gorgias",       key: gorgias, headed: "false" }   # Gorgias drives headless (fast, reliable)
          - { vendor: "Sierra",        key: sierra,  headed: "true"  }
          - { vendor: "Siena",         key: siena,   headed: "true"  }
          - { vendor: "Envive",        key: envive,  headed: "true"  }
          - { vendor: "Ada",           key: ada,     headed: "true"  }
          - { vendor: "Kodif",         key: kodif,   headed: "true"  }
          - { vendor: "Rep AI",        key: repai,   headed: "true"  }
          - { vendor: "DigitalGenius", key: dg,      headed: "true"  }
          - { vendor: "Humind",        key: humind,  headed: "true"  }
          - { vendor: "Meta AI",       key: meta,    headed: "true"  }
          - { vendor: "Yuma",          key: yuma,    headed: "true"  }
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps + Chromium + xvfb
        working-directory: runner
        run: |
          npm install
          npx playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Capture ${{ matrix.vendor }} (both lanes)
        working-directory: runner
        timeout-minutes: 85       # per-STEP: on timeout the job still runs the upload step below
        continue-on-error: true
        env:
          TURN_TIMEOUT_MS: "70000"
          RUN_DATE: ${{ github.event.inputs.run_date }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          export RUN_DATE="${RUN_DATE:-$(date +%F)}"
          HEAD=""; [ "${{ matrix.headed }}" = "true" ] && HEAD="--headed"
          MODEARG=""; [ -n "$MODE" ] && MODEARG="--mode $MODE"
          echo "vendor='${{ matrix.vendor }}' headed=${{ matrix.headed }} date=$RUN_DATE $MODEARG"
          for pass in 1 2; do
            echo "── ${{ matrix.key }} pass $pass ──"
            xvfb-run -a node run.js $HEAD --vendor "${{ matrix.vendor }}" $MODEARG --concurrency 2 || true
          done

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.key }}
          path: runner/results
          retention-days: 5
          if-no-files-found: ignore

  aggregate:
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download all vendor result artifacts
        uses: actions/download-artifact@v4
        with:
          path: runner/results
          pattern: results-*
          merge-multiple: true
      - name: Rebuild report + commit
        working-directory: runner
        run: |
          node gen.js
          cd ..
          git config user.name "benchmark-bot"
          git config user.email "actions@users.noreply.github.com"
          git add runner/results report.html
          git commit -m "Cloud benchmark (sharded) $(date +%F)" || { echo "no changes"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase origin master && git push && break || sleep 5
          done
