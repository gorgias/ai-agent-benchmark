<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gorgias AI Agent Benchmark — Sign in</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Feature Deck is the display serif — licensed, self-hosted, not on Google Fonts */
  @font-face{font-family:'Feature Deck';src:url('/brand/fonts/FeatureDeck-Regular-Web.woff2') format('woff2');font-weight:400;font-style:normal;font-display:block}
  @font-face{font-family:'Feature Deck';src:url('/brand/fonts/FeatureDeck-RegularItalic-Web.woff2') format('woff2');font-weight:400;font-style:italic;font-display:block}
  /* Ecom Lab system — values taken from gorgias.com/ecom-lab's computed styles.
     Warm canvas, ink type, Feature Deck display, Geist body, Geist Mono labels,
     lilac accent, 40px pills, hairline rules. No gradients, no elevation. */
  :root{
    --canvas:#F6F4F2; --surface:#FFFFFF; --tint:#EFE9E2;
    --ink:#1A1E23;    --body:#3A3E43;    --muted:#5C6066;
    --rule:#CAC7C2;   --border:#DDD9D4;
    --lilac:#F5D4FF;  --lilac-soft:#FAF1FE;
    --error:#BD3C3C;  --error-bg:#FDE9E9;
    --r:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Geist',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);background:var(--canvas);
    display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r);padding:36px 34px 30px;text-align:center;
  }
  .brand{display:inline-flex;align-items:center;justify-content:center;margin-bottom:26px}
  .brand .mark{height:22px;width:auto;display:block}
  h1{font-family:'Feature Deck',Georgia,serif;font-size:34px;font-weight:400;letter-spacing:0;line-height:1.15;margin-bottom:10px}
  .sub{color:var(--body);font-size:15px;line-height:1.55;margin-bottom:26px}
  form{display:flex;flex-direction:column;gap:10px}
  .field{position:relative;text-align:left}
  label{display:block;font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;font-weight:400;
    text-transform:uppercase;color:var(--muted);margin:0 0 8px 2px}
  input[type=password]{
    width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1px solid var(--border);
    border-radius:var(--r);background:var(--canvas);color:var(--ink);transition:border-color .15s;
  }
  input[type=password]:focus{outline:none;border-color:var(--ink);background:var(--surface)}
  button{
    margin-top:6px;font-family:'Geist Mono',ui-monospace,monospace;font-weight:400;font-size:14px;
    text-transform:uppercase;color:var(--ink);cursor:pointer;min-height:48px;
    padding:14px;border:0;border-radius:40px;background:var(--lilac);transition:filter .15s;
  }
  button:hover{filter:brightness(.96)}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .err{display:none;margin-bottom:16px;font-size:13.5px;color:var(--error);background:var(--error-bg);
    border:1px solid var(--error);border-radius:var(--r);padding:10px 13px}
  .err.show{display:block}
  .foot{margin-top:24px;padding-top:18px;border-top:1px dashed var(--rule);
    font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;text-transform:uppercase;color:var(--muted)}
  /* The source page ships light only; this keeps the dark preference working by
     reusing the same ink field the benchmark pages use for their dark section. */
  @media (prefers-color-scheme: dark){
    :root{--canvas:#1A1E23;--surface:#22262B;--tint:#2C3036;--ink:#F6F4F2;--body:#C9C6C1;
          --muted:#A5A29D;--rule:#3A3E43;--border:#3A3E43;--error:#F0A0A0;--error-bg:#3A2626}
    button{color:#1A1E23}
  }
</style>
</head>
<body>
  <main class="card">
    <div class="brand"><img class="mark" src="/brand/gorgias-logo.svg" alt="Gorgias" width="139" height="37"></div>
    <h1>AI Agent Benchmark</h1>
    <p class="sub">Internal competitive intelligence — Gorgias R&amp;D.<br>Enter the access password to continue.</p>
    <div class="err" id="err">Incorrect password. Please try again.</div>
    <form method="POST" action="/login" autocomplete="off">
      <div class="field">
        <label for="pw">Access password</label>
        <input id="pw" name="password" type="password" placeholder="••••••••••••" required autofocus>
      </div>
      <button type="submit">Access the benchmark</button>
    </form>
    <div class="foot">GORGIAS R&amp;D · COMPETITIVE INTELLIGENCE</div>
  </main>
  <script>
    if (new URLSearchParams(location.search).has('e')) document.getElementById('err').classList.add('show');
  </script>
</body>
</html>
