<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gorgias AI Agent Benchmark — Sign in</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/brand/tokens.css">
<style>
  body{
    font-family:var(--font-sans);
    color:var(--color-foreground);background:var(--color-background);
    display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  html,body{height:100%}
  *{box-sizing:border-box;margin:0;padding:0}
  .card{
    width:100%;max-width:420px;background:var(--color-card);border:1px solid var(--color-border);
    border-radius:var(--radius-3xl);padding:36px 34px 30px;text-align:center;
  }
  .brand{display:inline-flex;align-items:center;justify-content:center;margin-bottom:26px}
  .brand .mark{height:22px;width:auto;display:block}
  h1{font-family:var(--font-display);font-size:34px;font-weight:400;letter-spacing:0;line-height:1.15;margin-bottom:10px}
  .sub{color:var(--color-foreground-secondary);font-size:15px;line-height:1.55;margin-bottom:26px}
  form{display:flex;flex-direction:column;gap:10px}
  .field{position:relative;text-align:left}
  label{display:block;font-family:var(--font-mono);font-size:12px;font-weight:500;
    letter-spacing:var(--font-label-tracking);text-transform:uppercase;color:var(--color-muted-foreground);margin:0 0 8px 2px}
  input[type=password]{
    width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1px solid var(--color-border);
    border-radius:var(--radius-xl);background:var(--color-background);color:var(--color-foreground);transition:border-color .15s;
  }
  input[type=password]:focus{outline:none;border-color:var(--color-ring);background:var(--color-card)}
  button{
    margin-top:6px;font-family:var(--font-sans);font-weight:500;font-size:14px;
    color:var(--color-primary-foreground);cursor:pointer;min-height:48px;
    padding:14px;border:0;border-radius:var(--radius-pill);background:var(--color-primary);transition:background .15s;
  }
  button:hover{background:var(--color-primary-hover)}
  .err{display:none;margin-bottom:16px;font-size:13.5px;color:var(--gr-error-ink);background:var(--gr-error-bg);
    border:1px solid var(--color-coral-100);border-radius:var(--radius-xl);padding:10px 13px}
  .err.show{display:block}
  .foot{margin-top:24px;padding-top:18px;border-top:1px dashed var(--color-border-bold);
    font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:var(--font-label-tracking);text-transform:uppercase;color:var(--color-muted-foreground)}
  @media (prefers-color-scheme: dark){
    body{background:var(--color-neutral-950);color:var(--color-neutral-10)}
    .card{background:var(--color-neutral-900);border-color:var(--color-neutral-700)}
    input[type=password]{background:var(--color-neutral-950);color:var(--color-neutral-10);border-color:var(--color-neutral-700)}
    input[type=password]:focus{background:var(--color-neutral-900);border-color:var(--color-ring)}
    h1{color:var(--color-neutral-10)}
    .sub{color:var(--color-neutral-300)}
    button{background:var(--color-neutral-10);color:var(--color-neutral-950)}
    button:hover{background:var(--color-neutral-200)}
    .foot{color:var(--color-neutral-400);border-top-color:var(--color-neutral-700)}
  }
</style>
</head>
<body>
  <main class="card">
    <div class="brand"><img class="mark" src="/brand/gorgias-logo.svg" alt="Gorgias" width="139" height="37"></div>
    <h1>AI Agent Benchmark</h1>
    <p class="sub">Internal competitive intelligence — Gorgias R&amp;D.<br>Enter the access password to continue.</p>
    <div class="err" id="err">Incorrect password. Please try again.</div>
    <form method="POST" action="/login" autocomplete="off">
      <div class="field">
        <label for="pw">Access password</label>
        <input id="pw" name="password" type="password" placeholder="••••••••••••" required autofocus>
      </div>
      <button type="submit">Access the benchmark</button>
    </form>
    <div class="foot">GORGIAS R&amp;D · COMPETITIVE INTELLIGENCE</div>
  </main>
  <script>
    if (new URLSearchParams(location.search).has('e')) document.getElementById('err').classList.add('show');
  </script>
</body>
</html>
