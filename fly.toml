# Fly.io — nightly benchmark worker: capture, judge, bake, gate, deploy.
#
# Deliberately NOT a web service: there is nothing to serve. This is a scale-to-zero Machine that
# wakes once a night, runs sourcing → capture → healthcheck → publish, and exits. No [http_service]
# and no [[services]] block means Fly never routes traffic to it and never keeps it warm — you pay
# for the ~4h it actually runs, not 720h a month.
#
# Secrets (fly secrets set …, never in this file): GIT_SSH_KEY or GIT_TOKEN, ANTHROPIC_API_KEY,
# VERCEL_TOKEN, SITE_PASSWORD, SLACK_WEBHOOK_URL.
app = "gorgias-benchmark-capture"
primary_region = "iad"                 # US East: the market the benchmark measures. Capturing US
                                       # storefronts from the EU triggers GDPR consent gates that a
                                       # US shopper never sees, and those were scoring as vendor
                                       # failures (Topps, Rituals, Blakely all consent-gated).

[build]
  dockerfile = "server/Dockerfile"

[env]
  DAILY_TARGET   = "200"               # raised from 150 (2026-08-18) — see CAPTURE_SECONDS note.
                                       # The 150 target (set 2026-08-12) was NEVER actually hit:
                                       # daily yield over the following week ran 68-90/day (mean
                                       # ~80). Sizing 200 off the 150 miss, not off theory again.
  PER_VENDOR     = "2"                 # new verified storefronts sourced per vendor per day
  CONCURRENCY    = "5"                 # 5 conversations in parallel INSIDE one run.js process.
                                       # STRUCTURAL ceiling, not a CPU one: raising this risks
                                       # inflating measured latency (the headline metric) by
                                       # running more simultaneous sessions against the same
                                       # store's backend than a real shopper ever would. A bigger
                                       # machine cannot lift this — do not raise it to buy volume.
  CAPTURE_SECONDS = "39600"            # 11h, raised from 5.5h. The 5.5h/150 sizing (2026-08-12)
                                       # assumed a ~29 valid/hour historical mean that never held
                                       # up in production: actual attempts/hour is capped around
                                       # 26-31/hr — a STRUCTURAL ceiling from STORE_TIMEOUT_MIN
                                       # (18min) x ~10 conversations per store-call, independent of
                                       # window length — and yield only climbed to 46-67% over the
                                       # week as dead-store auto-park matured. This sizing uses the
                                       # week's OBSERVED valid/hour (~15-17.5, best day so far ~18)
                                       # with a conservative margin, not a repeat of the optimistic
                                       # theoretical calc that undershot last time. 2026-08-18 also
                                       # shipped ~30 newly-sourced stores and a couple of driver
                                       # fixes (see runner/vendors.js "Auto-sourced" + git log),
                                       # which should lift the achieved rate somewhat, but that is
                                       # not yet measured — verify actual yield over the next few
                                       # days and retune rather than trusting this number blindly.
                                       # BUDGET below is a hard ceiling well above target, so
                                       # higher-than-expected throughput exits early via the
                                       # adaptive water-line rather than overshooting.
  PUSH_EVERY     = "600"               # incremental push: caps data loss at 10 min if killed
  CAPTURE_LOG    = "/data/pipeline.log"

  # Deploy-on-merge: after a PR merges, a bounded poller at the start of the nightly run checks
  # whether the baked board changed on master and deploys it immediately (server/deploy-on-merge.sh
  # — re-bake from committed data, same quality gate, deploy, verify). Without this a merged PR
  # only goes live at tonight's publish. The poller window is 15 min so it can never eat capture;
  # judging stays nightly-only. Set 0 to disable.
  DEPLOY_ON_MERGE   = "1"
  DEPLOY_POLL_SECONDS = "900"

  # ── judging + deploy ────────────────────────────────────────────────────────
  JUDGE_MODEL       = "claude-sonnet-5"  # moved from claude-opus-4-8 (2026-08-18) — see
                                       # judge-api.mjs for the explicit effort:"high" pairing.
  JUDGE_CONCURRENCY = "4"
  JUDGE_MAX         = "400"            # cost ceiling per night (~$36 at ~$0.09/conversation).
                                       # Kept at ~2x DAILY_TARGET, same ratio as before — the
                                       # headroom lets a backlog drain without letting a runaway
                                       # bill run unattended.
  EVAL_BATCH_DIR    = "/data/eb"       # on the volume: a killed run resumes instead of re-judging
  # Vercel project identity. NOT secrets (the token is), and required because .vercel/ is
  # gitignored, so the CLI has no project link to read inside the container.
  VERCEL_ORG_ID     = "team_vYmSPwekFJOPhVoUuAGAMPGK"
  VERCEL_PROJECT_ID = "prj_Y7hKwp6KD568yGRxReyr8xtggNrv"

# Persistent volume: the whole reason Fly beats a serverless container here. Conversations land on
# disk before they are pushed, so a killed run leaves its work recoverable instead of vaporised.
[mounts]
  source      = "benchmark_data"
  destination = "/data"

# NEVER restart on failure. The pipeline exits non-zero on purpose — a critical healthcheck, a
# failed quality gate, a deploy that did not take. Fly's default `on-failure` policy would read
# those as crashes and relaunch a THREE-HOUR capture immediately, in a loop, for as long as the
# condition persists: a large bill and a pile of duplicate captures, caused by the job correctly
# reporting a problem. For a scheduled batch job the schedule is the retry mechanism.
#
# NOTE the value: fly.toml spells this "never", while the Machines API spells the same policy "no"
# (which is what `fly machine status --display-config` prints). Using "no" here fails config
# validation and blocks every deploy.
[[restart]]
  policy = "never"

[[vm]]
  # Bumped 2x → 4x (2026-08-12, evidence-backed, not a guess): CONCURRENCY=5 means 5 headless
  # Chromium contexts loading modern e-commerce sites (several run 5-6 tracking-pixel sandboxes
  # each) at once. On 2x, three previously-"dead" stores (klaviyo-happywax, intercom-flaviar,
  # klaviyo-onefastcat) went from 0/N valid at concurrency=5 to a clean, fully-measured
  # conversation (T1/T2/T3 all timed) at concurrency=1, run with the IDENTICAL widget driver code
  # — isolating CPU contention, not a driver bug, as the cause. DEDICATED vCPUs still matter more
  # than raw count (a throttled shared vCPU silently inflates latency), but 2 dedicated cores for
  # 5 concurrent browsers was simply undersized for the page weight these stores carry.
  size      = "performance-4x"         # 4 dedicated vCPU / 8GB
  memory    = "8gb"                    # 5 concurrent Chromium instances want headroom
